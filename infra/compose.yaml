services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opsdesk}
      POSTGRES_USER: ${POSTGRES_USER:-opsdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsdesk}
    ports:
      - "${OPSDESK_DB_PORT:-5432}:5432"
    volumes:
      - opsdesk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opsdesk} -d ${POSTGRES_DB:-opsdesk}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  opsdesk-postgres-data:
